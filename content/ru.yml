about:
  eyebrow: Обо мне
  heading: Работа над собой — трудный, но самый ценный путь
  lead: "Двадцать лет я работаю в страховании: от государственного надзора до руководства ведущими страховыми компаниями. Получил профессиональное образование в области страхования жизни в Японии."
  text: Провожу мастер-классы для студентов и молодёжи, делюсь опытом как спикер в предпринимательских клубах. В своём Telegram-канале пишу о жизни, семье, ценности времени, отношениях и работе над собой.
