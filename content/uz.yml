about:
  eyebrow: Мен ҳақимда
  heading: Шахс ислоҳи — машаққатли, лекин энг қимматли жараён
  lead: "Йигирма йилдан буён суғурта соҳасида ишлайман: давлат назоратидан тортиб, етакчи суғурта компанияларини бошқаришгача. Японияда ҳаёт суғуртаси бўйича профессионал таълим олганман."
  text: Талабалар ва ёшлар учун мастер-класслар ўтказаман, тадбиркорлар клубларида спикер сифатида тажриба улашаман. Telegram каналимда ҳаёт, оила, вақт қадри, муносабатлар ва ўз устида ишлаш ҳақидаги фикрларимни ёзиб бораман.
