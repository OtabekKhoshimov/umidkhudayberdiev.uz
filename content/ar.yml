cta:
  quote: |-
    سقطت البذرة في الأرض فصارت زهرة،
    وضحّت دودة القز بحياتها فصارت حريرًا.
    أليس لك همّة كبذرة الخزامى؟
    أليس لك سخاء كدودة القز؟
  quote_author: علي شير نوائي
  heading: لننمُ معًا!
  text: تُنشر المقالات الجديدة أولًا في قناة تيليغرام. وإذا رغبتم في دعوتي لإلقاء محاضرة أو تقديم دورة تدريبية، فتواصلوا معي عبر القناة أيضًا.
