about:
  eyebrow: نبذة عني
  heading: إصلاح الذات طريق شاق، لكنه أثمن طريق
  lead: أعمل في مجال التأمين منذ عشرين عامًا، من الرقابة الحكومية إلى قيادة كبرى شركات التأمين. وتلقيت تدريبًا مهنيًا في التأمين على الحياة في اليابان.
  text: أقدّم دورات تدريبية للطلاب والشباب، وأشارك خبرتي متحدثًا في نوادي رواد الأعمال. وفي قناتي على تيليغرام أكتب عن الحياة والأسرة وقيمة الوقت والعلاقات والعمل على الذات.
