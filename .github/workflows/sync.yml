name: Telegram'dan maqolalarni olish

on:
  schedule:
    - cron: "17 */2 * * *"   # har 2 soatda
  workflow_dispatch:
    inputs:
      full:
        description: "Kanal tarixini boshidan to'liq olish"
        type: boolean
        default: false
  push:
    paths:
      - "tools/**"
      - "data/site.json"
      - "data/hidden.json"

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Postlarni olish va saytni qurish
        run: ruby tools/sync.rb ${{ inputs.full && '--full' || '' }}
      - name: O'zgarishlarni saqlash
        run: |
          git config user.name "sayt-bot"
          git config user.email "sayt-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Yangi narsa yo'q"; exit 0; fi
          git commit -m "Telegram'dan yangilandi"
          git push
